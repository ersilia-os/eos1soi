Title: Antimicrobial activity against non-growing bacteria
Description: Identifies compounds able to kill uropathogenic Escherichia coli that
  has stopped dividing, a state in which most antibiotics lose their effect and which
  underlies recurrent infection. Kaldalu and colleagues screened 6,454 approved drugs
  and clinical candidates using dilution-regrowth assays that measure actual killing
  rather than growth inhibition, then extended testing to intracellular bacteria.
  The screen covers repurposing candidates rather than novel chemistry, so predictions
  are anchored to drug-like space already in clinical use.
