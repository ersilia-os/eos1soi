Identifier: eos1soi
Slug: non-growing-antimicrobial
Status: Ready
Title: Antimicrobial activity against non-growing bacteria
Description: Identifies compounds able to kill uropathogenic Escherichia coli 
  that has stopped dividing, a state in which most antibiotics lose their effect
  and which underlies recurrent infection. Kaldalu and colleagues screened 6,454
  approved drugs and clinical candidates in dilution-regrowth assays that 
  register killing and delayed regrowth. Ersilia trained a LazyQSAR classifier 
  on 5,584 of them, 37 active, with a five-fold out-of-fold AUROC of 0.97. 
  Fluoroquinolones dominate the actives, so the active chemistry is narrow.
